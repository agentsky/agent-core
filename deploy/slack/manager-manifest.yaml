# The Slack manager app's manifest: the one app per workspace that declares
# /agent, answers commands and sends every private reply. Replace
# ${PUBLIC_URL} with agentd's public HTTPS URL, without a trailing slash,
# then create the app from it at https://api.slack.com/apps ("Create New
# App", "From a manifest"). README.md walks through the steps.
#
#   PUBLIC_URL=https://agentd.example.com envsubst '$PUBLIC_URL' \
#     < deploy/slack/manager-manifest.yaml
display_information:
  name: agent-core
  description: Link your Claude account and manage your Claude Code agents.
  long_description: >-
    agent-core runs Claude Code agents that members mention in channels. This
    app is its manager: /agent links your Claude account, registers the Slack
    configuration token agent-core creates your agents' apps with, and manages
    your agents. Its replies are visible only to you. Send /agent help to see
    every command.
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: agent-core
    always_online: true
  slash_commands:
    - command: /agent
      url: ${PUBLIC_URL}/slack/b/manager/commands
      description: Link your Claude account and manage your agents
      usage_hint: help | login | me | slack-token <token> <refresh token>
      should_escape: true
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      - im:write
      - im:history
      - users:read
      - files:read
settings:
  event_subscriptions:
    request_url: ${PUBLIC_URL}/slack/b/manager/events
    bot_events:
      - message.im
      - user_change
  interactivity:
    is_enabled: true
    request_url: ${PUBLIC_URL}/slack/b/manager/interactivity
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
