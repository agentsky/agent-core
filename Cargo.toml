[package]
name = "agent-core"
version.workspace = true
edition.workspace = true
description = "Pure-Rust core for @mentionable Claude Code agents in Slack and Rocket.Chat."
readme = "README.md"
license-file.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[workspace]
members = ["crates/*"]
default-members = [".", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license-file = "LICENSE"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
agentd = { path = "crates/agentd" }
core-types = { path = "crates/core-types" }
store = { path = "crates/store" }
auth = { path = "crates/auth" }
render = { path = "crates/render" }
commands = { path = "crates/commands" }
router = { path = "crates/router" }
runner = { path = "crates/runner" }
sandbox = { path = "crates/sandbox" }
cred-proxy = { path = "crates/cred-proxy" }
surface-rocketchat = { path = "crates/surface-rocketchat" }
surface-slack = { path = "crates/surface-slack" }
testkit = { path = "crates/testkit" }

anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.23.1"
bollard = "0.21.1"
bytes = "1.12.1"
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
hmac = "0.13.0"
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1.21", features = ["full"] }
log = "0.4.34"
pulldown-cmark = { version = "0.13.4", default-features = false }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "query"] }
rustix = { version = "1.1.5", default-features = false, features = ["fs", "process"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_path_to_error = "0.1.20"
serde_urlencoded = "0.7.1"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros", "time", "uuid", "json"] }
subtle = "2.6.1"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
toml = "1.1.6"
tower = "0.5.3"
tracing = "0.1.44"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
wiremock = "0.6.5"
